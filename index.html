<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111020">
<title>我的音樂室</title>
<style>
:root{color-scheme:dark;--bg:#0d0d19;--panel:#17172a;--panel2:#202039;--line:#343451;--text:#f7f5ff;--muted:#aaa8c7;--accent:#b5a5ff;--accent2:#8069ed}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
body{min-height:100vh;min-height:100dvh;padding:clamp(12px,2.5vw,30px);background:radial-gradient(ellipse at 15% 0%,#302451 0%,#151426 42%,#0d0d19 78%)}
button,input{font:inherit}button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}
.app{width:min(1440px,100%);margin:0 auto}
.topbar{display:flex;align-items:center;gap:16px;margin:0 0 22px;padding:0 4px}
.logo{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;flex:none;background:linear-gradient(145deg,#e0d5ff,#8069ed);color:#171329;font-size:31px;box-shadow:0 8px 28px #8069ed45}
h1{font-size:clamp(23px,3vw,34px);line-height:1.15;margin:0;font-weight:800;letter-spacing:.02em}.subtitle{margin-top:6px;color:var(--muted);font-size:14px}
.layout{display:grid;grid-template-columns:minmax(0, .95fr) minmax(380px,1.05fr);gap:20px;align-items:stretch}
.panel{background:#171728ed;border:1px solid var(--line);border-radius:28px;box-shadow:0 20px 70px #0005;min-width:0}
.player-panel{padding:clamp(20px,3vw,38px);display:flex;flex-direction:column;justify-content:center;min-height:620px}
.cover{width:min(100%,360px);aspect-ratio:1;margin:0 auto 28px;border-radius:30px;position:relative;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,#6756a7 0%,#342a59 42%,#201b36 72%,#171728 100%);box-shadow:inset 0 0 60px #09081380,0 18px 45px #0005}
.cover:before,.cover:after{content:"";position:absolute;border:1px solid #ffffff20;border-radius:50%;width:82%;aspect-ratio:1}.cover:after{width:62%}
.disc{width:48%;aspect-ratio:1;border-radius:50%;z-index:1;display:grid;place-items:center;background:repeating-radial-gradient(circle,#11111c 0 5px,#2b2940 6px 9px);box-shadow:0 15px 35px #0008;animation:spin 14s linear infinite;animation-play-state:paused}
.disc:before{content:"";position:absolute;width:12%;aspect-ratio:1;border-radius:50%;background:linear-gradient(145deg,#e0d5ff,#8c75f1);border:5px solid #25213b}
body.is-playing .disc{animation-play-state:running}@keyframes spin{to{transform:rotate(360deg)}}
.now{text-align:center;margin:0 auto 28px;max-width:100%}.song-title{font-size:clamp(22px,2.6vw,32px);font-weight:800;overflow-wrap:anywhere}.song-artist{font-size:16px;color:var(--muted);margin-top:8px;overflow-wrap:anywhere;min-height:24px}
.timeline{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;align-items:center;gap:12px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
#seek{width:100%;height:34px;margin:0;accent-color:var(--accent);cursor:pointer;touch-action:pan-y}
.controls{display:flex;justify-content:center;align-items:center;gap:clamp(24px,5vw,54px);margin:22px 0 0}
.control,.play{border:0;display:grid;place-items:center;cursor:pointer}
.control{width:76px;height:76px;border-radius:23px;background:#ffffff0b;color:#e9e3ff;font-size:34px;border:1px solid #ffffff12}
.play{width:94px;height:94px;border-radius:30px;background:linear-gradient(145deg,#d9ceff,#927df5);color:#171329;font-size:35px;box-shadow:0 10px 28px #8069ed55}
.control:active,.play:active,.track:active{transform:scale(.97)}button:focus-visible,.track:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.list-panel{padding:clamp(18px,2.5vw,30px);display:flex;flex-direction:column;min-height:620px;min-width:0}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px}.list-head h2{font-size:22px;margin:0}.count{color:var(--muted);font-size:14px;white-space:nowrap}
.playlist{display:flex;flex-direction:column;gap:10px;overflow-y:auto;overflow-x:hidden;min-height:0;max-height:calc(100dvh - 190px);padding:2px 8px 4px 2px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;scrollbar-width:thin;scrollbar-color:#7967c7 #25243a}
.playlist::-webkit-scrollbar{width:12px}.playlist::-webkit-scrollbar-track{background:#25243a;border-radius:20px}.playlist::-webkit-scrollbar-thumb{background:#7967c7;border:3px solid #25243a;border-radius:20px}
.track{width:100%;min-height:78px;flex:none;display:flex;align-items:center;gap:16px;padding:13px 16px;border-radius:19px;border:1px solid #ffffff12;background:#ffffff07;color:var(--text);text-align:left;cursor:pointer;touch-action:manipulation;transition:background .15s,border-color .15s}
.track:hover{background:#ffffff10}.track.active{border-color:#9582ed;background:linear-gradient(100deg,#8c75f126,#ffffff08)}
.track-number{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;background:#302d4b;color:#dcd4ff;font-size:17px;font-weight:700}
.track-info{flex:1;min-width:0}.track-name{font-size:17px;font-weight:750;overflow-wrap:anywhere}.track-artist{font-size:14px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}.track-status{font-size:20px;color:var(--accent);min-width:24px;text-align:center}
.empty{padding:30px;text-align:center;color:var(--muted)}
.footer{text-align:center;color:#8582a4;font-size:12px;margin:18px 0 0}
@media(max-width:850px){.layout{grid-template-columns:1fr}.player-panel{min-height:0}.list-panel{min-height:420px}.cover{width:min(68vw,300px)}.playlist{max-height:420px}}
@media(max-width:480px){body{padding:12px}.topbar{margin-bottom:14px}.logo{width:48px;height:48px;border-radius:15px}.panel{border-radius:22px}.player-panel{padding:20px 16px}.cover{width:min(62vw,230px);margin-bottom:20px;border-radius:23px}.now{margin-bottom:18px}.controls{gap:18px;margin-top:16px}.control{width:62px;height:62px;border-radius:19px;font-size:27px}.play{width:78px;height:78px;border-radius:25px;font-size:30px}.list-panel{padding:18px 14px;min-height:380px}.list-head h2{font-size:20px}.track{min-height:72px;padding:11px 12px;gap:12px}.track-number{width:40px;height:40px}.track-name{font-size:15px}.track-artist{font-size:13px}.playlist{max-height:380px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <header class="topbar"><div class="logo" aria-hidden="true">♫</div><div><h1>我的音樂室</h1><div class="subtitle">挑選一首喜歡的歌曲，開始聆聽</div></div></header>
  <div class="layout">
    <section class="panel player-panel" aria-label="音樂播放器">
      <div class="cover" aria-hidden="true"><div class="disc"></div></div>
      <div class="now"><div class="song-title" id="songTitle">選擇一首歌曲</div><div class="song-artist" id="songArtist">我的音樂收藏</div></div>
      <div class="timeline"><span id="currentTime">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="播放進度"><span id="duration">0:00</span></div>
      <div class="controls"><button class="control" id="prev" type="button" aria-label="上一首" title="上一首">⏮</button><button class="play" id="play" type="button" aria-label="播放" title="播放">▶</button><button class="control" id="next" type="button" aria-label="下一首" title="下一首">⏭</button></div>
    </section>
    <section class="panel list-panel" aria-label="歌曲播放清單"><div class="list-head"><h2>播放清單</h2><span class="count" id="count"></span></div><div class="playlist" id="playlist" aria-label="歌曲列表"></div></section>
  </div>
  <div class="footer">我的音樂收藏 · Touch friendly</div>
  <audio id="audio" preload="metadata"></audio>
</main>
<script>
/* 保留原本歌曲與檔名；音樂檔案請放在本 HTML 相同資料夾。 */
const SONGS = [
  {name:"Never Gonna Give You Up",artist:"Rick Astley",audio:"song2.mp3"},
  {name:"A2O lite Neon",artist:"Rock",audio:"song3.opus"},
  {name:"無",artist:"Rock",audio:"song4.mp3"},
  {name:"無",artist:"Rock",audio:"song5.mp3"},
  {name:"無",artist:"Rock",audio:"song6.mp3"},
  {name:"第二首歌曲",artist:"歌手名稱",audio:"song7.mp3"}
];
const audio=document.getElementById('audio');
const titleEl=document.getElementById('songTitle');
const artistEl=document.getElementById('songArtist');
const playBtn=document.getElementById('play');
const seek=document.getElementById('seek');
const playlistEl=document.getElementById('playlist');
let current=0,dragging=false;
function timeText(value){if(!Number.isFinite(value)||value<0)return '0:00';value=Math.floor(value);return Math.floor(value/60)+':'+String(value%60).padStart(2,'0')}
function updatePlaylistState(){playlistEl.querySelectorAll('.track').forEach((row,index)=>{const active=index===current;row.classList.toggle('active',active);row.setAttribute('aria-current',active?'true':'false');row.querySelector('.track-status').textContent=active?'♫':''})}
function renderPlaylist(){
  document.getElementById('count').textContent=SONGS.length+' 首歌曲';playlistEl.replaceChildren();
  SONGS.forEach((song,index)=>{
    const row=document.createElement('button');row.type='button';row.className='track';row.setAttribute('aria-label','播放 '+(song.name||('第 '+(index+1)+' 首')));
    const number=document.createElement('span');number.className='track-number';number.textContent=String(index+1);
    const info=document.createElement('span');info.className='track-info';
    const name=document.createElement('span');name.className='track-name';name.textContent=song.name||('第 '+(index+1)+' 首歌曲');
    const artist=document.createElement('span');artist.className='track-artist';artist.textContent=song.artist||'未知作者';
    const status=document.createElement('span');status.className='track-status';status.setAttribute('aria-hidden','true');info.append(name,artist);row.append(number,info,status);
    row.addEventListener('click',()=>loadSong(index,true));playlistEl.append(row);
  });updatePlaylistState();
}
function loadSong(index,autoplay=false){
  if(!SONGS.length)return;current=(index+SONGS.length)%SONGS.length;const song=SONGS[current];
  titleEl.textContent=song.name||('第 '+(current+1)+' 首歌曲');artistEl.textContent=song.artist||'未知作者';seek.value=0;
  document.getElementById('currentTime').textContent='0:00';document.getElementById('duration').textContent='0:00';
  audio.src=song.audio;audio.load();updatePlaylistState();
  if(autoplay)audio.play().catch(()=>{artistEl.textContent='無法開始播放，請確認音樂檔案存在，然後再按一次播放。'});
  else syncPlayButton(false);
}
function syncPlayButton(playing){playBtn.textContent=playing?'❚❚':'▶';playBtn.setAttribute('aria-label',playing?'暫停':'播放');playBtn.title=playing?'暫停':'播放';document.body.classList.toggle('is-playing',playing)}
playBtn.addEventListener('click',()=>{if(!SONGS.length)return;if(!audio.getAttribute('src'))loadSong(current,false);if(audio.paused)audio.play().catch(()=>{artistEl.textContent='無法開始播放，請確認音樂檔案存在。'});else audio.pause()});
document.getElementById('prev').addEventListener('click',()=>loadSong(current-1,true));
document.getElementById('next').addEventListener('click',()=>loadSong(current+1,true));
audio.addEventListener('play',()=>syncPlayButton(true));audio.addEventListener('pause',()=>syncPlayButton(false));
audio.addEventListener('ended',()=>{if(current<SONGS.length-1)loadSong(current+1,true);else{audio.currentTime=0;syncPlayButton(false)}});
audio.addEventListener('loadedmetadata',()=>document.getElementById('duration').textContent=timeText(audio.duration));
audio.addEventListener('error',()=>{const code=audio.error?.code;const messages={1:'播放已取消。',2:'載入音樂時發生網路錯誤，請確認音樂網址可公開存取。',3:'瀏覽器無法解碼此音樂格式，請嘗試 MP3 或 M4A。',4:'找不到音樂檔案。請檢查 song2.mp3 至 song7.mp3 是否放在正確資料夾。'};artistEl.textContent=messages[code]||'音樂載入失敗，請檢查音樂檔案路徑。'});
audio.addEventListener('timeupdate',()=>{document.getElementById('currentTime').textContent=timeText(audio.currentTime);if(!dragging&&Number.isFinite(audio.duration)&&audio.duration>0)seek.value=audio.currentTime/audio.duration*1000});
seek.addEventListener('pointerdown',()=>{dragging=true});seek.addEventListener('input',()=>{if(Number.isFinite(audio.duration))document.getElementById('currentTime').textContent=timeText(Number(seek.value)/1000*audio.duration)});
function finishSeek(){if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=Number(seek.value)/1000*audio.duration;dragging=false}
seek.addEventListener('change',finishSeek);seek.addEventListener('pointerup',finishSeek);seek.addEventListener('pointercancel',()=>{dragging=false});
renderPlaylist();if(SONGS.length)loadSong(0,false);else{titleEl.textContent='目前沒有歌曲';artistEl.textContent='請在 HTML 的 SONGS 清單新增歌曲';document.getElementById('count').textContent='0 首歌曲'}
</script>
</body>
</html>
